limit_req_zone $binary_remote_addr zone=hanbo_test:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hanbo_login:10m rate=6r/m;
log_format hanbo_json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name __TEST_IP__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://__TEST_IP__$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __TEST_IP__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/hanbo-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanbo-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hanbo_tls:10m;
    ssl_session_timeout 1d;
    client_max_body_size 8m;
    access_log /var/log/nginx/hanbo-test.access.log hanbo_json;
    error_log /var/log/nginx/hanbo-test.error.log warn;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~* ^/auth/test/login/?$ {
        limit_req zone=hanbo_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=hanbo_test burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }
}
